name: furb-publish

# A tag furb-vX.Y.Z publishes to crates.io the five crates of this fork that furb runs, under the names of furb:
# furb-sandbox-macros, furb-sandbox-types, furb-sandbox, furb-sandbox-typeshed and furb-sandbox-type-checking, in
# that order, at the version X.Y.Z. The tag stands on a commit that scripts/furb_release.py made on the line of furb,
# which gives the five those names and that version, so the line keeps the names of monty. No other crate of the fork
# goes, and ci.yml runs no job of a release on such a tag. A pull request that changes what they hold, or a run
# started by hand, names the five as the script does, then packs and builds them as crates.io would, and publishes
# nothing, which is the rehearsal of a release.
on:
  push:
    tags: ['furb-v*']
  pull_request:
    paths:
      - .github/workflows/furb-publish.yml
      - scripts/furb_release.py
      - Cargo.toml
      - crates/monty/**
      - crates/monty-types/**
      - crates/monty-macros/**
      - crates/monty-type-checking/**
      - crates/monty-typeshed/**
  workflow_dispatch:

permissions: {}

env:
  CRATES: -p furb-sandbox-macros -p furb-sandbox-types -p furb-sandbox -p furb-sandbox-typeshed -p furb-sandbox-type-checking

jobs:
  package:
    name: pack the crates of furb
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: stable
      # A tag publishes the version that it names, and no other.
      - if: github.ref_type == 'tag'
        run: |
          for crate in monty monty-types monty-macros monty-type-checking monty-typeshed; do
            test "furb-v$(sed -n 's/^version = \"\\(.*\\)\"$/\\1/p' crates/$crate/Cargo.toml)" = "$GITHUB_REF_NAME"
          done
      # A rehearsal names the five as a release does.
      - if: github.ref_type != 'tag'
        run: python3 scripts/furb_release.py 0.0.0-rehearsal
      # cargo packs the five together and builds each from what it packed, against the others as packed.
      - run: cargo package --allow-dirty $CRATES
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crates
          path: target/package/*.crate

  publish:
    name: publish to crates.io
    needs: [package]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: crates-io
      url: https://crates.io/crates/furb-sandbox
    # Trusted publishing: the job trades the OIDC token of GitHub for a short lived token of crates.io. crates.io trusts
    # a workflow only for a crate that stands already, so the first release takes the token that the secret
    # CARGO_REGISTRY_TOKEN holds, and a release after it takes none once the owner removes that secret.
    permissions:
      contents: read
      id-token: write
    env:
      FIRST: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: stable
      - if: env.FIRST != 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      # cargo publishes the five in the order of their dependencies, and waits for each in the index before the next.
      - run: cargo publish $CRATES
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
